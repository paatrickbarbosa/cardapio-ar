<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cardápio em realidade aumentada</title>
  <script type="module" src="model-viewer.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <h1 id="nome-restaurante">Pecas</h1>
    <p id="subtitulo"></p>
  </header>
  <main id="lista"></main>

  <section id="viewer" aria-modal="true" role="dialog">
    <header>
      <button id="fechar" aria-label="Voltar">←</button>
      <h3 id="viewer-nome"></h3>
    </header>
    <model-viewer id="mv" camera-controls touch-action="pan-y" shadow-intensity="1" exposure="1" ar
      ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor" xr-environment
      camera-orbit="30deg 60deg auto" alt="Prato em 3D">
      <button slot="ar-button" class="ar-btn">Ver na minha mesa</button>

      <div class="ar-ui ar-info" aria-live="polite">
        <strong id="ar-nome"></strong>
        <span id="ar-preco"></span>
      </div>
      <p class="ar-ui ar-ajuda" id="ar-ajuda">Arraste para mover na mesa</p>
      <div class="ar-ui ar-controles" id="ar-controles" role="toolbar" aria-label="Controles do prato">
        <button type="button" id="ar-maior" aria-label="Aumentar">+</button>
        <button type="button" id="ar-escala" aria-label="Voltar ao tamanho real">Real</button>
        <button type="button" id="ar-menor" aria-label="Diminuir">&minus;</button>
        <button type="button" id="ar-girar-esq" aria-label="Girar para a esquerda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg>
        </button>
        <button type="button" id="ar-girar-dir" aria-label="Girar para a direita">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7" /><path d="M21 4v5h-5" /></svg>
        </button>
      </div>
    </model-viewer>
    <p class="dica" id="dica">Gire o prato com o dedo. Toque em "Ver na minha mesa" e aponte o celular para a mesa.</p>
  </section>

  <script>
    const fmt = (v) => v ? v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : '';
    const viewer = document.getElementById('viewer');
    const mv = document.getElementById('mv');

    function abrir(prato) {
      document.getElementById('viewer-nome').textContent = prato.nome;
      mv.src = prato.modelo;
      // iPhone/iPad (Quick Look): usa o .usdz se existir; senão o model-viewer converte o .glb sozinho
      if (prato.modeloIos) mv.setAttribute('ios-src', prato.modeloIos); else mv.removeAttribute('ios-src');
      if (prato.imagem) mv.poster = prato.imagem; else mv.removeAttribute('poster');
      document.getElementById('ar-nome').textContent = prato.nome;
      document.getElementById('ar-preco').textContent = fmt(prato.preco);
      resetarAR();
      viewer.classList.add('aberto');
      history.pushState({ prato: prato.id }, '', '#' + prato.id);
    }
    function fechar() { viewer.classList.remove('aberto'); mv.removeAttribute('src'); }
    document.getElementById('fechar').onclick = () => history.back();
    window.addEventListener('popstate', fechar);

    mv.addEventListener('load', () => {
      if (!mv.canActivateAR) {
        document.getElementById('dica').textContent = window.isSecureContext
          ? 'Este aparelho não abre realidade aumentada. Gire o prato com o dedo para ver todos os lados.'
          : 'A realidade aumentada só funciona com o site aberto em https://. Gire o prato com o dedo para ver todos os lados.';
      }
    });
    // Controles do modo AR: giro em passos de 45 graus e escala de 50% a 300% (100% = tamanho real)
    const ESCALAS = [0.5, 0.75, 1, 1.5, 2, 3];
    let giro = 0, iEscala = ESCALAS.indexOf(1);

    function aplicarAR() {
      mv.orientation = `0deg 0deg ${giro}deg`;
      const s = ESCALAS[iEscala];
      mv.scale = `${s} ${s} ${s}`;
      document.getElementById('ar-escala').textContent = s === 1 ? 'Real' : Math.round(s * 100) + '%';
      document.getElementById('ar-menor').disabled = iEscala === 0;
      document.getElementById('ar-maior').disabled = iEscala === ESCALAS.length - 1;
    }
    function resetarAR() { giro = 0; iEscala = ESCALAS.indexOf(1); aplicarAR(); }

    document.getElementById('ar-girar-esq').onclick = () => { giro += 45; aplicarAR(); };
    document.getElementById('ar-girar-dir').onclick = () => { giro -= 45; aplicarAR(); };
    document.getElementById('ar-menor').onclick = () => { iEscala = Math.max(0, iEscala - 1); aplicarAR(); };
    document.getElementById('ar-maior').onclick = () => { iEscala = Math.min(ESCALAS.length - 1, iEscala + 1); aplicarAR(); };
    document.getElementById('ar-escala').onclick = () => { iEscala = ESCALAS.indexOf(1); aplicarAR(); };

    // Impede que o toque nos botões também mova o prato na cena de AR
    for (const el of document.querySelectorAll('.ar-ui')) {
      el.addEventListener('beforexrselect', (e) => e.preventDefault());
    }

    mv.addEventListener('ar-status', (e) => {
      const status = e.detail.status;
      mv.classList.toggle('em-ar', status === 'session-started' || status === 'object-placed');
      document.getElementById('ar-ajuda').textContent = status === 'object-placed'
        ? 'Arraste para mover o prato na mesa'
        : 'Aponte o celular para a mesa';
      if (status === 'not-presenting') resetarAR();
      if (status === 'failed') {
        document.getElementById('dica').textContent =
          'Não foi possível abrir a realidade aumentada. Verifique se a câmera está liberada e tente de novo.';
      }
    });
    if (!window.isSecureContext) console.warn('AR desativado: a página precisa ser servida por HTTPS.');

    fetch('cardapio.json').then(r => r.json()).then(dados => {
      document.title = dados.restaurante + ' · Cardápio';
      document.getElementById('nome-restaurante').textContent = dados.restaurante;
      document.getElementById('subtitulo').textContent = dados.subtitulo;
      const lista = document.getElementById('lista');
      const categorias = [...new Set(dados.pratos.map(p => p.categoria))];
      for (const cat of categorias) {
        const h = document.createElement('h2'); h.textContent = cat; lista.appendChild(h);
        for (const p of dados.pratos.filter(p => p.categoria === cat)) {
          const b = document.createElement('button');
          b.className = 'prato';
          b.innerHTML = `<img alt="" loading="lazy"><div style="flex:1"><h3></h3><p></p>
        <div class="linha"><span class="preco"></span><span class="tag">Ver em 3D ›</span></div></div>`;
          if (p.imagem) b.querySelector('img').src = p.imagem; else b.querySelector('img').remove();
          b.querySelector('h3').textContent = p.nome;
          b.querySelector('p').textContent = p.descricao;
          b.querySelector('.preco').textContent = fmt(p.preco);
          b.onclick = () => abrir(p);
          lista.appendChild(b);
        }
      }
      // Link direto para um prato (ex.: QR code de um prato específico: ...#nachos)
      const alvo = dados.pratos.find(p => '#' + p.id === location.hash);
      if (alvo) { history.replaceState(null, '', location.pathname); abrir(alvo); }
    });
  </script>
</body>

</html>
